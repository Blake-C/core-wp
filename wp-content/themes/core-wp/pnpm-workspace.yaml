packages:
  - '.'

# Force patched transitive dependencies flagged by Snyk and pnpm audit.
# ws: CVE-2026-45736 (use of uninitialized resource); fixed in >= 8.20.1.
# js-yaml: GHSA-5p4m-2wfm-xmqj and GHSA-2883-xcg3-v3hh (CPU exhaustion); fixed in >= 4.3.2.
# postcss-selector-parser: CVE-2026-9358 (uncontrolled recursion); fixed in >= 6.1.3.
# brace-expansion: GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895 (out-of-memory DoS); fixed in >= 5.0.9.
# fast-uri: GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7, GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
#   GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp (host confusion and SSRF); fixed in >= 3.1.6.
# postcss: GHSA-r28c-9q8g-f849 (source map path traversal) and GHSA-fxqj-rqcc-2cmp; fixed in >= 8.5.23.
#   @stylistic/stylelint-plugin pins an older postcss than the theme's direct dependency.
# nanoid: GHSA-28wg-ghj8-5hjv and GHSA-2v37-7h3g-55p8 (infinite loop); fixed in >= 3.3.18.
# socket.io-parser: GHSA-2m8v-j782-fhvr (memory exhaustion); fixed in >= 4.2.7.
# browserslist: GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g; fixed in >= 4.28.7.
# baseline-browser-mapping: GHSA-w5vr-8v7q-w6rv (process termination); fixed in >= 2.11.0.
# colord: GHSA-2wm5-q62r-hmrv (slow malformed color parsing); fixed in >= 2.9.4.
# immutable@5 (via sass): GHSA-v56q-mh7h-f735 and GHSA-xvcm-6775-5m9r; fixed in >= 5.1.8.
# immutable@3 (via browser-sync): 3.8.4 ports the fixes for CVE-2026-59879 and CVE-2026-59880 onto 3.x. The
#   GHSA-v56q-mh7h-f735 record predates 3.8.4 and still lists only 4.3.9 as patched, so pnpm audit reports it.
overrides:
  ws: '^8.20.1'
  js-yaml: '^4.3.2'
  postcss-selector-parser: '^6.1.3'
  brace-expansion: '^5.0.9'
  fast-uri: '^3.1.6'
  postcss: '^8.5.28'
  nanoid: '^3.3.18'
  socket.io-parser: '^4.2.7'
  browserslist: '^4.28.7'
  baseline-browser-mapping: '^2.11.0'
  colord: '^2.9.4'
  'immutable@5': '^5.1.8'
  'immutable@3': '^3.8.4'

frozenLockfile: true
saveExact: true
verifyStoreIntegrity: true
# Sets the minimum severity for `pnpm audit` only. An install does not run an audit.
audit:
  level: moderate
# node_modules is shared between the host and the cli_tools container, so a mismatch
# with the lockfile stops `pnpm run` and `pnpm exec` instead of running an install first.
verifyDepsBeforeRun: error
# Applies the engines check to dependencies. The theme's own engines range is checked with or without it.
engineStrict: true
blockExoticSubdeps: true
minimumReleaseAge: 10080
# A release with weaker publisher trust evidence than an earlier release of the same package
# fails the install, which still blocks a stolen maintainer account's release after minimumReleaseAge.
trustPolicy: no-downgrade
# browser-sync requires ua-parser-js ^1. The same maintainer publishes the MIT 1.x line without
# provenance and the AGPL 2.x line with it, so each 1.x release reads as a downgrade by publish date.
trustPolicyExclude:
  - 'ua-parser-js@1.0.41'
fetchTimeout: 60000
fetchRetries: 5
fetchRetryMintimeout: 1000
fetchRetryMaxtimeout: 30000
# @parcel/watcher is a native addon that sass installs as an optional dependency, and its install script builds it.
# The core-js postinstall only prints a donation banner.
allowBuilds:
  '@parcel/watcher': true
  core-js: false
